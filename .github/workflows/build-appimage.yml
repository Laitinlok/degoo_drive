name: Build AppImage & Deb

on:
  push:
    branches: [feat/gui]
    tags: ["v*"]
  pull_request:
    branches: [feat/gui]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # ── System dependencies ────────────────────────────────────────────────
      - name: Install system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            rpm fakeroot dpkg libarchive-tools imagemagick \
            libfuse3-dev libfuse3-3 fuse3 \
            python3 python3-dev python3-pip python3-venv \
            libssl-dev libsqlite3-dev pkg-config \
            meson ninja-build build-essential git

      - name: Install Node dependencies
        run: npm install

      - name: Generate icon
        run: |
          mkdir -p assets
          convert -size 512x512 xc:transparent \
            -fill '#01696f' -draw 'circle 256,256 256,30' \
            -fill white -font Liberation-Sans-Bold -pointsize 300 \
            -gravity Center -draw 'text 0,20 "D"' \
            assets/icon.png

      # ── Bundle Python runtime + all deps ──────────────────────────────────
      - name: Bundle Python runtime
        run: |
          set -euo pipefail

          PYVER=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          echo "Python version: $PYVER"

          PYLIB="python/lib/python${PYVER}"
          SITE="${PYLIB}/site-packages"
          DYNLOAD="${PYLIB}/lib-dynload"
          mkdir -p "$SITE" "$DYNLOAD" python/bin

          # 1. Python binary
          cp "$(which python3)" python/bin/python3
          chmod +x python/bin/python3

          # 2. stdlib
          STDLIB_SRC=$(python3 -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')
          echo "stdlib src: $STDLIB_SRC"
          cp -rT "$STDLIB_SRC" "${PYLIB}/"

          # 3. lib-dynload (C stdlib extensions: _sqlite3.so, _ssl.so, etc.)
          #    These MUST live at $PYTHONHOME/lib/pythonX.Y/lib-dynload/ so
          #    that CPython's import machinery finds them when PYTHONHOME is set.
          DYNLOAD_SRC="/usr/lib/python${PYVER}/lib-dynload"
          if [ ! -d "$DYNLOAD_SRC" ]; then
            PLATSTDLIB=$(python3 -c 'import sysconfig; print(sysconfig.get_path("platstdlib"))')
            DYNLOAD_SRC="${PLATSTDLIB}/lib-dynload"
          fi
          echo "lib-dynload src: $DYNLOAD_SRC"
          cp -r "${DYNLOAD_SRC}/"* "$DYNLOAD/"
          echo "  -> $(ls $DYNLOAD | wc -l) C extensions bundled"

          # Verify _sqlite3 is present (it is always needed at runtime)
          ls "$DYNLOAD"/_sqlite3*.so 2>/dev/null || \
            { echo "ERROR: _sqlite3.so missing from lib-dynload"; exit 1; }

          # 4. pip toolchain
          pip3 install --upgrade pip setuptools wheel

          # 5. Python deps
          pip3 install \
            --target="$SITE" \
            "pyfuse3>=3.2.1" \
            "requests>=2.25.1" \
            "python-dateutil>=2.8.1" \
            "urllib3>=1.26.5" \
            "humanfriendly>=10.0" \
            "humanize>=4.1.0" \
            "trio>=0.21.0"

          # Verify pyfuse3 .so landed in site-packages and imports correctly
          PYTHONPATH="$SITE" python3 -c \
            'import pyfuse3; print("pyfuse3 OK:", pyfuse3.__file__)'

          # 6. cligoo
          git config --global user.email "ci@build" || true
          git config --global user.name  "CI"        || true

          pip3 install --target="$SITE" "cligoo" 2>/dev/null || \
          pip3 install --target="$SITE" \
            "git+https://github.com/marcomc/cligoo.git@main"

          PYTHONPATH="$SITE" python3 -c \
            'from cligoo.api import DegooClient; print("cligoo OK")'

          # 7. Shared libraries that the bundled .so files dlopen() at runtime.
          #    We copy the real files AND their symlinks so ldconfig-style
          #    soname resolution works inside the AppImage sandbox.
          mkdir -p python/shlib
          for pat in \
            "/usr/lib/x86_64-linux-gnu/libfuse3.so*" \
            "/lib/x86_64-linux-gnu/libfuse3.so*" \
            "/usr/lib/x86_64-linux-gnu/libpython${PYVER}*.so*" \
            "/lib/x86_64-linux-gnu/libpython${PYVER}*.so*" \
            "/usr/lib/x86_64-linux-gnu/libssl.so*" \
            "/lib/x86_64-linux-gnu/libssl.so*" \
            "/usr/lib/x86_64-linux-gnu/libcrypto.so*" \
            "/lib/x86_64-linux-gnu/libcrypto.so*" \
            "/usr/lib/x86_64-linux-gnu/libsqlite3.so*" \
            "/lib/x86_64-linux-gnu/libsqlite3.so*"; do
            for f in $pat; do
              [ -e "$f" ] && cp -Pv "$f" python/shlib/ 2>/dev/null || true
            done
          done

          echo "Bundle size: $(du -sh python | cut -f1)"

      # ── Shell launcher ────────────────────────────────────────────────────
      # Critical rules:
      #   - Use printf, not heredoc, to avoid variable-expansion surprises
      #     when PYVER contains dots (heredoc delimiter matching).
      #   - PYTHONHOME must point at the python/ subtree so CPython finds
      #     its stdlib at $PYTHONHOME/lib/pythonX.Y/ AND lib-dynload under it.
      #   - PYTHONPATH adds site-packages on top of PYTHONHOME so pip-installed
      #     packages (pyfuse3, cligoo, trio, ...) are importable.
      #   - LD_LIBRARY_PATH prepends shlib/ so libfuse3/libpython/libssl are
      #     found before system libs (which may be the wrong version).
      - name: Write Python launcher script
        run: |
          PYVER=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')

          printf '%s\n' \
            '#!/bin/sh' \
            'SELF="$(cd "$(dirname "$0")" && pwd)"' \
            'PYBASE="$(cd "$SELF/.." && pwd)"' \
            'export PYTHONHOME="$PYBASE"' \
            "export PYTHONPATH=\"\$PYBASE/lib/python${PYVER}/site-packages\${PYTHONPATH:+:\$PYTHONPATH}\"" \
            'export LD_LIBRARY_PATH="$PYBASE/shlib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec "$SELF/python3" "$@"' \
            > python/bin/degoo_python.sh

          chmod +x python/bin/degoo_python.sh
          echo "--- Launcher contents ---"
          cat python/bin/degoo_python.sh

          # Smoke-test: the launcher must be able to import all critical modules
          python/bin/degoo_python.sh -c \
            'import sqlite3, pyfuse3; from cligoo.api import DegooClient; print("All imports OK")'

      # ── Stage fuse_degoo.py ───────────────────────────────────────────────
      - name: Stage backend script
        run: |
          if [ ! -f fuse_degoo.py ]; then
            git fetch origin feat/cligoo-backend
            git checkout origin/feat/cligoo-backend -- fuse_degoo.py
          fi

      - name: Build AppImage + Deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: degoo-drive-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
          generate_release_notes: true
