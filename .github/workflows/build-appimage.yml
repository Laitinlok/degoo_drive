name: Build AppImage & Deb

on:
  push:
    branches: [feat/gui]
    tags: ["v*"]
  pull_request:
    branches: [feat/gui]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # ── System dependencies ────────────────────────────────────────────
      # pyfuse3 needs libfuse3-dev + meson + ninja to compile its C extension.
      # Without these pip will fail to build the wheel.
      - name: Install system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            rpm fakeroot dpkg libarchive-tools imagemagick \
            libfuse3-dev libfuse3-3 fuse3 \
            python3 python3-dev python3-pip python3-venv \
            libssl-dev libsqlite3-dev pkg-config \
            meson ninja-build build-essential

      - name: Install Node dependencies
        run: npm install

      - name: Generate icon
        run: |
          mkdir -p assets
          convert -size 512x512 xc:transparent \
            -fill '#01696f' -draw 'circle 256,256 256,30' \
            -fill white -font Liberation-Sans-Bold -pointsize 300 \
            -gravity Center -draw 'text 0,20 "D"' \
            assets/icon.png

      # ── Bundle Python runtime + all deps ──────────────────────────────
      - name: Bundle Python runtime
        run: |
          set -euo pipefail

          PYVER=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          echo "Python version: $PYVER"

          # ── Directory layout expected by CPython when PYTHONHOME=python/ ──
          #
          #   python/
          #     bin/python3               <- interpreter binary
          #     lib/
          #       pythonX.Y/
          #         lib-dynload/          <- _sqlite3.so, _ssl.so … (C exts)
          #         site-packages/        <- pip deps: pyfuse3, cligoo, trio …
          #     lib/pythonX.Y/            <- ALSO the stdlib location CPython
          #       encodings/              <- searches when PYTHONHOME is set
          #       … (rest of stdlib)
          #
          # CPython resolves stdlib as  $PYTHONHOME/lib/pythonX.Y/
          # lib-dynload as              $PYTHONHOME/lib/pythonX.Y/lib-dynload/
          # site-packages is on PYTHONPATH explicitly.

          PYLIB="python/lib/python${PYVER}"
          SITE="${PYLIB}/site-packages"
          DYNLOAD="${PYLIB}/lib-dynload"
          mkdir -p "$SITE" "$DYNLOAD" python/bin

          # ── 1. Python binary ──────────────────────────────────────────
          cp "$(which python3)" python/bin/python3
          chmod +x python/bin/python3

          # ── 2. stdlib → python/lib/pythonX.Y/ ─────────────────────────
          # sysconfig gives us the installed stdlib path (e.g. /usr/lib/python3.10)
          STDLIB_SRC=$(python3 -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')
          echo "stdlib src: $STDLIB_SRC"
          # Copy stdlib contents directly into python/lib/pythonX.Y/
          # (not into a nested subdir) so PYTHONHOME resolution works.
          cp -rT "$STDLIB_SRC" "${PYLIB}/"

          # ── 3. lib-dynload → python/lib/pythonX.Y/lib-dynload/ ─────────
          # Ubuntu 22.04 places lib-dynload at /usr/lib/python3.X/lib-dynload
          DYNLOAD_SRC="/usr/lib/python${PYVER}/lib-dynload"
          if [ ! -d "$DYNLOAD_SRC" ]; then
            # Fallback: derive from platstdlib
            PLATSTDLIB=$(python3 -c 'import sysconfig; print(sysconfig.get_path("platstdlib"))')
            DYNLOAD_SRC="${PLATSTDLIB}/lib-dynload"
          fi
          echo "lib-dynload src: $DYNLOAD_SRC"
          cp -r "${DYNLOAD_SRC}/"* "$DYNLOAD/"
          echo "  -> $(ls $DYNLOAD | wc -l) C extensions bundled"

          # ── 4. pip install all Python deps ─────────────────────────────
          # Upgrade pip first so it can handle recent wheel formats.
          pip3 install --upgrade pip setuptools wheel

          # pyfuse3 must be built from source (needs libfuse3-dev, meson,
          # ninja — installed in the system-deps step above).
          pip3 install \
            --target="$SITE" \
            "pyfuse3>=3.2.1" \
            "requests>=2.25.1" \
            "python-dateutil>=2.8.1" \
            "urllib3>=1.26.5" \
            "humanfriendly>=10.0" \
            "humanize>=4.1.0" \
            "trio>=0.21.0"

          # cligoo: try PyPI first, fall back to git source.
          pip3 install --target="$SITE" "cligoo>=0.1.1" || \
          pip3 install --target="$SITE" \
            "git+https://github.com/Laitinlok/cligoo.git@main#egg=cligoo" || \
          pip3 install --target="$SITE" \
            "git+https://github.com/Laitinlok/degoo_drive.git@feat/cligoo-backend#subdirectory=cligoo"

          # ── 5. Shared libraries (libfuse3, libpython, libssl) ───────────
          mkdir -p python/shlib
          for pat in \
            "/usr/lib/x86_64-linux-gnu/libfuse3.so*" \
            "/lib/x86_64-linux-gnu/libfuse3.so*" \
            "/usr/lib/x86_64-linux-gnu/libpython${PYVER}*.so*" \
            "/lib/x86_64-linux-gnu/libpython${PYVER}*.so*" \
            "/usr/lib/x86_64-linux-gnu/libssl.so*" \
            "/lib/x86_64-linux-gnu/libssl.so*" \
            "/usr/lib/x86_64-linux-gnu/libcrypto.so*" \
            "/lib/x86_64-linux-gnu/libcrypto.so*"; do
            for f in $pat; do
              [ -e "$f" ] && cp -Pv "$f" python/shlib/ 2>/dev/null || true
            done
          done

          echo "Bundle size: $(du -sh python | cut -f1)"

      # ── Write the shell launcher that sets env BEFORE exec'ing Python ──
      # This is the critical fix: PYTHONHOME must be in the environment
      # before the interpreter binary loads, not passed via spawn env
      # from Node — on some systems the AppImage squashfs mount means
      # the env vars set by Node's child_process.spawn don't reach the
      # dynamic linker early enough.
      - name: Write Python launcher script
        run: |
          cat > python/bin/degoo_python.sh << 'LAUNCHER'
          #!/bin/sh
          # Resolve the directory this script lives in, even after symlinks.
          SELF="$(cd "$(dirname "$0")" && pwd)"
          PYBASE="$(cd "$SELF/.." && pwd)"

          export PYTHONHOME="$PYBASE"
          export PYTHONPATH="$PYBASE/lib/python__PYVER__/site-packages${PYTHONPATH:+:$PYTHONPATH}"
          export LD_LIBRARY_PATH="$PYBASE/shlib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          exec "$SELF/python3" "$@"
          LAUNCHER
          chmod +x python/bin/degoo_python.sh

          # Stamp the real python version into the launcher
          PYVER=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          sed -i "s/__PYVER__/${PYVER}/g" python/bin/degoo_python.sh
          echo "Launcher:"
          cat python/bin/degoo_python.sh

      # ── Stage fuse_degoo.py ────────────────────────────────────────────
      - name: Stage backend script
        run: |
          if [ ! -f fuse_degoo.py ]; then
            git fetch origin feat/cligoo-backend
            git checkout origin/feat/cligoo-backend -- fuse_degoo.py
          fi

      - name: Build AppImage + Deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: degoo-drive-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
          generate_release_notes: true
