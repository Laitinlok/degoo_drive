name: Build AppImage & Deb

on:
  push:
    branches: [feat/gui]
    tags: ["v*"]
  pull_request:
    branches: [feat/gui]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            rpm fakeroot dpkg libarchive-tools imagemagick \
            libfuse3-dev libfuse3-3 fuse3 \
            python3 python3-dev python3-pip python3-venv \
            libssl-dev pkg-config

      - name: Install Node dependencies
        run: npm install

      - name: Generate icon
        run: |
          mkdir -p assets
          convert -size 512x512 xc:transparent \
            -fill '#01696f' -draw 'circle 256,256 256,30' \
            -fill white -font Liberation-Sans-Bold -pointsize 300 \
            -gravity Center -draw 'text 0,20 "D"' \
            assets/icon.png

      # ── Bundle Python runtime + all deps ───────────────────────────────
      - name: Bundle Python deps (including pyfuse3)
        run: |
          # Detect version from the real python3 binary symlink target
          PYVER=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          PYVER_FULL=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}")')
          echo "Python: $PYVER  ($PYVER_FULL)"

          SITE=python/lib/python${PYVER}/site-packages
          mkdir -p "$SITE"

          # ── pip install all Python deps into bundle ────────────────────
          pip3 install \
            --target="$SITE" \
            --no-build-isolation \
            "pyfuse3>=3.2.1" \
            "requests>=2.25.1" \
            "python-dateutil>=2.8.1" \
            "urllib3>=1.26.5" \
            "humanfriendly>=10.0" \
            "humanize>=4.1.0" \
            "trio>=0.21.0" \
            "cligoo>=1.0.0" || \
          pip3 install \
            --target="$SITE" \
            --no-build-isolation \
            "pyfuse3>=3.2.1" \
            "requests>=2.25.1" \
            "python-dateutil>=2.8.1" \
            "urllib3>=1.26.5" \
            "humanfriendly>=10.0" \
            "humanize>=4.1.0" \
            "trio>=0.21.0"

          # ── Copy python3 binary ──────────────────────────────────
          mkdir -p python/bin
          cp $(which python3) python/bin/python3

          # ── stdlib (pure-Python modules) ────────────────────────────
          STDLIB=$(python3 -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')
          cp -r "$STDLIB" python/stdlib

          # ── lib-dynload (C extension .so files: _sqlite3, _ssl, _hashlib …) ─
          # These MUST live inside PYTHONHOME at lib/pythonX.Y/lib-dynload/
          DYNLOAD=$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("DESTLIB") or "")' 2>/dev/null || true)
          # Fallback: find lib-dynload relative to platstdlib
          PLATSTDLIB=$(python3 -c 'import sysconfig; print(sysconfig.get_path("platstdlib"))')
          DYNLOAD_DIR="${PLATSTDLIB}/lib-dynload"
          if [ ! -d "$DYNLOAD_DIR" ]; then
            # Ubuntu keeps it at /usr/lib/python3.X/lib-dynload
            DYNLOAD_DIR="/usr/lib/python${PYVER}/lib-dynload"
          fi
          echo "lib-dynload: $DYNLOAD_DIR"
          mkdir -p "python/lib/python${PYVER}/lib-dynload"
          cp -r "$DYNLOAD_DIR/"* "python/lib/python${PYVER}/lib-dynload/"

          # ── Shared libraries (libfuse3, libpython, libssl, libcrypto) ─────
          mkdir -p python/lib
          for pat in \
            "/usr/lib/x86_64-linux-gnu/libfuse3.so*" \
            "/lib/x86_64-linux-gnu/libfuse3.so*" \
            "/usr/lib/x86_64-linux-gnu/libpython${PYVER}*.so*" \
            "/lib/x86_64-linux-gnu/libpython${PYVER}*.so*" \
            "/usr/lib/x86_64-linux-gnu/libssl.so*" \
            "/lib/x86_64-linux-gnu/libssl.so*" \
            "/usr/lib/x86_64-linux-gnu/libcrypto.so*" \
            "/lib/x86_64-linux-gnu/libcrypto.so*"; do
            for f in $pat; do
              [ -e "$f" ] && cp -Pv "$f" python/lib/ || true
            done
          done

          echo "Bundle size: $(du -sh python | cut -f1)"
          echo "lib-dynload entries: $(ls python/lib/python${PYVER}/lib-dynload | wc -l)"

      # ── Stage backend script ───────────────────────────────────────
      - name: Stage backend script
        run: |
          if [ ! -f fuse_degoo.py ]; then
            git fetch origin feat/cligoo-backend
            git checkout origin/feat/cligoo-backend -- fuse_degoo.py
          fi

      - name: Build AppImage + Deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: degoo-drive-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
          generate_release_notes: true
