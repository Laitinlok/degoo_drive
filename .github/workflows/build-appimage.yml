name: Build AppImage & Deb

on:
  push:
    branches: [feat/gui]
    tags: ["v*"]
  pull_request:
    branches: [feat/gui]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # ── System dependencies ──────────────────────────────────────────────
      # pyfuse3 needs libfuse3-dev + meson + ninja to compile its C extension.
      # git is needed by pip to clone cligoo from GitHub.
      - name: Install system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            rpm fakeroot dpkg libarchive-tools imagemagick \
            libfuse3-dev libfuse3-3 fuse3 \
            python3 python3-dev python3-pip python3-venv \
            libssl-dev libsqlite3-dev pkg-config \
            meson ninja-build build-essential git

      - name: Install Node dependencies
        run: npm install

      - name: Generate icon
        run: |
          mkdir -p assets
          convert -size 512x512 xc:transparent \
            -fill '#01696f' -draw 'circle 256,256 256,30' \
            -fill white -font Liberation-Sans-Bold -pointsize 300 \
            -gravity Center -draw 'text 0,20 "D"' \
            assets/icon.png

      # ── Bundle Python runtime + all deps ────────────────────────────────
      - name: Bundle Python runtime
        run: |
          set -euo pipefail

          PYVER=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          echo "Python version: $PYVER"

          PYLIB="python/lib/python${PYVER}"
          SITE="${PYLIB}/site-packages"
          DYNLOAD="${PYLIB}/lib-dynload"
          mkdir -p "$SITE" "$DYNLOAD" python/bin

          # ── 1. Python binary ──────────────────────────────────────────────
          cp "$(which python3)" python/bin/python3
          chmod +x python/bin/python3

          # ── 2. stdlib → python/lib/pythonX.Y/ ────────────────────────────
          STDLIB_SRC=$(python3 -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')
          echo "stdlib src: $STDLIB_SRC"
          cp -rT "$STDLIB_SRC" "${PYLIB}/"

          # ── 3. lib-dynload → python/lib/pythonX.Y/lib-dynload/ ───────────
          DYNLOAD_SRC="/usr/lib/python${PYVER}/lib-dynload"
          if [ ! -d "$DYNLOAD_SRC" ]; then
            PLATSTDLIB=$(python3 -c 'import sysconfig; print(sysconfig.get_path("platstdlib"))')
            DYNLOAD_SRC="${PLATSTDLIB}/lib-dynload"
          fi
          echo "lib-dynload src: $DYNLOAD_SRC"
          cp -r "${DYNLOAD_SRC}/"* "$DYNLOAD/"
          echo "  -> $(ls $DYNLOAD | wc -l) C extensions bundled"

          # ── 4. pip — upgrade toolchain ────────────────────────────────────
          pip3 install --upgrade pip setuptools wheel

          # ── 5. pip — core deps (pyfuse3 built from source) ────────────────
          pip3 install \
            --target="$SITE" \
            "pyfuse3>=3.2.1" \
            "requests>=2.25.1" \
            "python-dateutil>=2.8.1" \
            "urllib3>=1.26.5" \
            "humanfriendly>=10.0" \
            "humanize>=4.1.0" \
            "trio>=0.21.0"

          # ── 6. cligoo — the Degoo API client library ──────────────────────
          # cligoo is authored by marcomc and lives at:
          #   https://github.com/marcomc/cligoo
          # It is NOT on PyPI (at least not under that name/version), so we
          # install directly from the upstream git repository.
          #
          # Install chain:
          #   a) PyPI  (succeeds once/if marcomc publishes a release)
          #   b) git source from marcomc/cligoo@main
          #
          # git config identity is required by some pip git backends.
          git config --global user.email "ci@build" || true
          git config --global user.name  "CI"        || true

          pip3 install --target="$SITE" "cligoo" 2>/dev/null || \
          pip3 install --target="$SITE" \
            "git+https://github.com/marcomc/cligoo.git@main"

          # Verify cligoo installed correctly
          PYTHONPATH="$SITE" python3 -c \
            'from cligoo.api import DegooClient; print("cligoo OK")'

          # ── 7. Shared libraries (libfuse3, libpython, libssl) ─────────────
          mkdir -p python/shlib
          for pat in \
            "/usr/lib/x86_64-linux-gnu/libfuse3.so*" \
            "/lib/x86_64-linux-gnu/libfuse3.so*" \
            "/usr/lib/x86_64-linux-gnu/libpython${PYVER}*.so*" \
            "/lib/x86_64-linux-gnu/libpython${PYVER}*.so*" \
            "/usr/lib/x86_64-linux-gnu/libssl.so*" \
            "/lib/x86_64-linux-gnu/libssl.so*" \
            "/usr/lib/x86_64-linux-gnu/libcrypto.so*" \
            "/lib/x86_64-linux-gnu/libcrypto.so*"; do
            for f in $pat; do
              [ -e "$f" ] && cp -Pv "$f" python/shlib/ 2>/dev/null || true
            done
          done

          echo "Bundle size: $(du -sh python | cut -f1)"

      # ── Shell launcher: sets PYTHONHOME *before* exec'ing Python ──────────
      - name: Write Python launcher script
        run: |
          PYVER=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')

          cat > python/bin/degoo_python.sh << LAUNCHER
          #!/bin/sh
          SELF="\$(cd "\$(dirname "\$0")" && pwd)"
          PYBASE="\$(cd "\$SELF/.." && pwd)"
          export PYTHONHOME="\$PYBASE"
          export PYTHONPATH="\$PYBASE/lib/python${PYVER}/site-packages\${PYTHONPATH:+:\$PYTHONPATH}"
          export LD_LIBRARY_PATH="\$PYBASE/shlib\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}"
          exec "\$SELF/python3" "\$@"
          LAUNCHER

          chmod +x python/bin/degoo_python.sh
          echo "--- Launcher contents ---"
          cat python/bin/degoo_python.sh

      # ── Stage fuse_degoo.py ───────────────────────────────────────────────
      - name: Stage backend script
        run: |
          if [ ! -f fuse_degoo.py ]; then
            git fetch origin feat/cligoo-backend
            git checkout origin/feat/cligoo-backend -- fuse_degoo.py
          fi

      - name: Build AppImage + Deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: degoo-drive-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
          generate_release_notes: true
